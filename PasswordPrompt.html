<!DOCTYPE html>
<html>
  <head>
    <base target="_blank">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        max-width: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
      }

      body {
        text-align: center;
        padding: 20px;
      }

      img.logo {
        width: 72px;
        height: 72px;
        margin-bottom: 15px;
        border-radius: 8px;
      }

      h2 {
        font-size: 18px;
        margin-bottom: 10px;
        color: #333;
      }

      p {
        font-size: 14px;
        color: #555;
        margin-bottom: 20px;
        padding: 0 10px;
      }

      button {
        background-color: #004c97;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 14px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      button:hover {
        background-color: #003a73;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="https://static.wixstatic.com/media/492ab6_0c9e895017a64150ae96b0bc5411d680~mv2.png/v1/fill/w_192,h_192,lg_1,q_90/492ab6_0c9e895017a64150ae96b0bc5411d680~mv2.webp" alt="Cantara Logo">

  </body>
</html>
